[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-reliability-lab"
version = "0.2.0"
description = "A local-first, read-only network health monitoring and incident transition demonstration"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nr-lab = "network_reliability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
